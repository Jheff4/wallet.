<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/razor.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Experience the future of finance with a sleek and secure wallet
    that combines sharp security and user-friendly design. Turbo
    charge your transactions, embrace decentralization, and redefine
    your digital journey. Join the Movement with Razor Wallet"
    />
    <link
      rel="preload"
      href="/fonts/Satoshi-Regular.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Satoshi-Medium.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <title>Razor Wallet</title>

    <style>
      * {
        font-family: 'Satoshi', sans-serif;
        box-sizing: border-box;
        /* scrollbar-width: '3px'; */
      }
      body {
        position: relative;
      }

      ::-webkit-scrollbar {
        background-color: #000;
        width: 6px;

        /* border-radius: 50%; */
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(90deg, #ffc80f 0%, #ff9a00 100%) no-repeat;
        /* width: 7px; */
        border-radius: 700px;
      }

      /**
          Explicitly load Satoshi var from public/ so it does not block LCP's critical path.
        */
      @font-face {
        font-family: 'Satoshi';
        font-weight: 535;
        font-style: normal;
        font-display: block;
        src: url('/fonts/Satoshi-Medium.woff') format('woff');
      }

      @font-face {
        font-family: 'Satoshi';
        font-weight: 485;
        font-style: normal;
        font-display: block;
        src: url('/fonts/Satoshi-Regular.woff') format('woff');
      }

      @supports (font-variation-settings: normal) {
        * {
          font-family: 'Satoshi', sans-serif;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
